<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#516880"/></marker></defs><rect width="1120" height="340" rx="14" fill="#f7f9fc"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#213c60}.title{font-size:20px;font-weight:700}.sub{font-size:15px;fill:#586b80}.box{fill:white;stroke:#cbd7e5;stroke-width:1.5}.link{stroke:#516880;stroke-width:2;marker-end:url(#arrow);fill:none}</style><text x="28" y="36" class="title">生成通路与测量通路</text><rect x="28" y="65" width="236" height="76" rx="8" class="box"/><text x="146" y="94" text-anchor="middle" class="title">输入与控制</text><text x="146" y="120" text-anchor="middle" class="sub">拨码 / 按键消抖 / 扫频</text><path d="M265 103H295" class="link"/><rect x="304" y="65" width="236" height="76" rx="8" class="box"/><text x="422" y="94" text-anchor="middle" class="title">DDS</text><text x="422" y="120" text-anchor="middle" class="sub">11位相位累加 / 256点查表</text><path d="M541 103H571" class="link"/><rect x="580" y="65" width="236" height="76" rx="8" class="box"/><text x="698" y="94" text-anchor="middle" class="title">DAC 接口</text><text x="698" y="120" text-anchor="middle" class="sub">8位数据 → 14位接口</text><path d="M817 103H847" class="link"/><rect x="856" y="65" width="236" height="76" rx="8" class="box"/><text x="974" y="94" text-anchor="middle" class="title">模拟输出</text><text x="974" y="120" text-anchor="middle" class="sub">四种波形 / 外部滤波</text><rect x="28" y="203" width="236" height="76" rx="8" class="box"/><text x="146" y="232" text-anchor="middle" class="title">外部信号与 ADC</text><text x="146" y="258" text-anchor="middle" class="sub">10位采样数据</text><path d="M265 241H295" class="link"/><rect x="304" y="203" width="236" height="76" rx="8" class="box"/><text x="422" y="232" text-anchor="middle" class="title">整形与边沿检测</text><text x="422" y="258" text-anchor="middle" class="sub">固定中心码滞回 / 同步</text><path d="M541 241H571" class="link"/><rect x="580" y="203" width="236" height="76" rx="8" class="box"/><text x="698" y="232" text-anchor="middle" class="title">频率与占空比</text><text x="698" y="258" text-anchor="middle" class="sub">闸门计数 / 多周期测量</text><path d="M817 241H847" class="link"/><rect x="856" y="203" width="236" height="76" rx="8" class="box"/><text x="974" y="232" text-anchor="middle" class="title">数码管显示</text><text x="974" y="258" text-anchor="middle" class="sub">理论频率 / 测频 / 占空比</text><text x="28" y="176" class="sub">理论频率由控制字换算后送往显示；两条通路的模拟连接由实验接线决定。</text><text x="28" y="315" class="sub">结构图依据整理版 top.v 绘制；不表示片内存在模拟回环。</text></svg>
